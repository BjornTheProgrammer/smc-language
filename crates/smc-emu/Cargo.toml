[package]
name = "smc-emu"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
description = "An emulator for the CPUs targeted by the SMC assembler."

# Velopack packages the emulator instead (see .github/workflows/velopack.yml)
[package.metadata.dist]
dist = false

[dependencies]
smc-assembler = { version = "0.4.0", path = "../smc-assembler" }
thiserror = { workspace = true }

iced = { version = "0.14", features = ["advanced", "canvas", "tokio"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
velopack = "=1.2.161"

[dev-dependencies]
iced_test = "0.14"
