[package]
name = "smc-emu"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
description = "An emulator for the CPUs targeted by the SMC assembler."

[package.metadata.wix]
upgrade-guid = "D56FBA57-9ED4-4338-B8B3-F27162CEF725"
path-guid = "AB6F07DB-C79D-4867-80A3-58C9DCF6082A"
license = false
eula = false

[dependencies]
smc-assembler = { version = "0.4.0", path = "../smc-assembler" }
thiserror = { workspace = true }

iced = { version = "0.14", features = ["canvas", "tokio"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
iced_test = "0.14"
